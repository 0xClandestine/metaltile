[package]
name = "metaltile-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MetalTile kernel standard library — benchmark metadata and type definitions"
publish = true

build = "bin/build.rs"

[lints]
workspace = true

[features]
# Run the registered #[test_kernel] corpus on the CUDA backend
# (tests/cuda_kernel_corpus.rs). Forwards to the facade's cuda feature.
cuda = ["metaltile/cuda"]

[[bin]]
name = "__tile_runner"
path = "bin/runner.rs"

[dependencies]
metaltile.workspace = true
half.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# AURA MSL snapshot tests (tests/aura_msl_snapshots.rs).
insta.workspace = true
bytemuck.workspace = true
